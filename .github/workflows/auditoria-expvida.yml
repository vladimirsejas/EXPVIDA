name: EXPVIDA auditoria - testes unitarios

on:
  push:
    branches:
      - auditoria-chatgpt-2026-11-27
      - codex-preparo-h10
      - chatgpt-tau-periodos
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-unitarios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias dos testes
        run: python -m pip install --upgrade pip numpy pandas scipy
      - name: Executar testes de classificacao, H10 e tau por periodo
        run: python -m unittest -v test_classificacao_causas test_h10_shapley test_causas_tau_periodos
